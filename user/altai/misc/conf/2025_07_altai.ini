[RunControl]
dataproducers  = ALPIDE_plane_0,ALPIDE_plane_1,ALPIDE_plane_2,ALPIDE_plane_3
#moreproducers  = POWER_0,PTH_0,RTD23_0,ZABER_0
loggers     = log
collectors  = dc
configs     = /home/user/eudaq2/user/altai/misc/altai.conf

[LibraryPaths]
trigger_path = /home/user/trigger/software/

[LogCollector.log]
FILE_PATTERN = EUDAQLog$12D.log
# 0: DEBUG, 4: INFO, 5: WARN, 6: ERROR
LOG_LEVEL_WRITE = 0
LOG_LEVEL_PRINT = 1

[DataCollector.dc]
dataproducers = ALPIDE_plane_0,ALPIDE_plane_1,ALPIDE_plane_2,ALPIDE_plane_3

#[Producer.POWER_0]
#path        = /dev/hmp4040

#[Producer.ZABER_0]
#serial_path = /dev/ttyUSB0
#config_path = zaber/zaberconf.json

[Producer.ALPIDE_plane_1]
serial      = DAQ-0009030300832631
plane       = 1
triggermode = primary

[Producer.ALPIDE_plane_0]
serial      = DAQ-0009030300832524
plane       = 0
triggermode = replica

[Producer.ALPIDE_plane_2]
#serial      = DAQ-000903030083263A
serial 	    = DAQ-0009042501141331
plane       = 2
triggermode = replica

[Producer.ALPIDE_plane_3]
serial      = DAQ-000903030083252B
plane       = 3
