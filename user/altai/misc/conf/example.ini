########################################################################
# example.ini — template for a new ALTAI run-control config.
#
# Copy this file (and example.conf) to a new name and edit:
#   cp example.ini   my_setup.ini
#   cp example.conf  my_setup.conf
# then update the "configs =" path below to point at your new .conf file.
#
# Based on 20260717_ALTAI_2sensors.ini (2-plane standalone cosmics run).
########################################################################

[RunControl]
# One entry per connected ALPIDE plane. Add/remove planes here AND in
# [DataCollector.dc] AND as their own [Producer.ALPIDE_plane_N] section below.
dataproducers  = ALPIDE_plane_0,ALPIDE_plane_1
loggers        = log
collectors     = dc
# Must be an ABSOLUTE path to the matching .conf file (relative paths don't work).
configs        = /home/altai/altaiOS/eudaq/user/altai/misc/conf/example.conf

[LibraryPaths]

[LogCollector.log]
FILE_PATTERN    = EUDAQLog$12D.log
LOG_LEVEL_WRITE = 0
LOG_LEVEL_PRINT = 1

[DataCollector.dc]
dataproducers = ALPIDE_plane_0, ALPIDE_plane_1

# plane_0 is the primary trigger master — exactly one plane must be "primary",
# all others "replica". Find your board's serial with:
#   alpide-daq-program --list
[Producer.ALPIDE_plane_0]
serial      = DAQ-XXXXXXXXXXXXXXXX
plane       = 0
triggermode = primary

[Producer.ALPIDE_plane_1]
serial      = DAQ-YYYYYYYYYYYYYYYY
plane       = 1
triggermode = replica
