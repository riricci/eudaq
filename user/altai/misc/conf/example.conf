########################################################################
Author Riccardo Ricci (riccardo.ricci@cern.ch)
# example.conf — per-plane analog settings, paired with example.ini.
# Based on 20260717_ALTAI_2sensors.conf (2-plane standalone cosmics run).
# Here basically you can adjust the single ALTAI/ALPIDE thresholds. 
# Note that ALTAI has a limited threshold range so playing with these values 
# can easily lead to a non-working configuration. 
########################################################################

[RunControl]
EUDAQ_CTRL_PRODUCER_LAST_START = ALPIDE_plane_0
EUDAQ_CTRL_PRODUCER_FIRST_STOP = ALPIDE_plane_0
# Target events for the run to stop on its own; for an untriggered/cosmics
# run this can take a long time to reach — stop manually with [S] if needed.
NEVENTS   = 1000000

# ITHR/VCASN/VCASN2/VCLIP/IDB/STROBE_LENGTH are per-chip analog tuning —
# these values are copied from an existing working config as a starting
# point, but should be re-verified per chip (e.g. via threshold scan).

[Producer.ALPIDE_plane_0]
EUDAQ_DC      = dc
EUDAQ_ID      = 0
ITHR          = 50 
VCASN         = 55
VCASN2        = 67
VCLIP         = 0
IDB           = 29
STROBE_LENGTH = 400

[Producer.ALPIDE_plane_1]
EUDAQ_DC      = dc
EUDAQ_ID      = 1
CHIPID        = 16
ITHR          = 60
VCASN         = 58
VCASN2        = 68
VCLIP         = 0
IDB           = 29
STROBE_LENGTH = 400

[DataCollector.dc]
EUDAQ_FW         = native
# Output raw file pattern — $6R = run number (6 digits), $12D = timestamp,
# $X = extension. Adjust the directory to your DATA path.
EUDAQ_FW_PATTERN = /home/altai/DATA/run$6R_$12D$X
