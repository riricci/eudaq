# primary trigger master
[Producer.ALPIDE_plane_0]
serial      = DAQ-00090101054B1009
plane       = 0
triggermode = primary

[Producer.ALPIDE_plane_1]
serial      = DAQ-0009012905CF1A03
plane       = 1
triggermode = replica
