[RunControl]
dataproducers  = ALPIDE_plane_0,ALPIDE_plane_1
loggers        = log
collectors     = dc
configs        = /home/altai/altaiOS/eudaq/user/altai/misc/conf/20260717_ALTAI_2sensors.conf

[LibraryPaths]

[LogCollector.log]
FILE_PATTERN    = EUDAQLog$12D.log
LOG_LEVEL_WRITE = 0
LOG_LEVEL_PRINT = 1

[DataCollector.dc]
