[RunControl]
dataproducers  = ALPIDE_plane_0,ALPIDE_plane_1,ALPIDE_plane_2,ALPIDE_plane_3
loggers        = log
collectors     = dc
configs        = /home/user/altaiOS/eudaq/user/altai/misc/conf/202606_ALTAI_BO.conf

[LibraryPaths]

[LogCollector.log]
FILE_PATTERN    = EUDAQLog$12D.log
LOG_LEVEL_WRITE = 0
LOG_LEVEL_PRINT = 1

[DataCollector.dc]
dataproducers = ALPIDE_plane_0,ALPIDE_plane_1, ALPIDE_plane_2, ALPIDE_plane_3

# ALTAI_0 = primary trigger master
[Producer.ALPIDE_plane_0]
serial      = DAQ-00090101054B1009
plane       = 0
triggermode = primary

[Producer.ALPIDE_plane_1]
serial      = DAQ-0009012905CF1A03
plane       = 1
triggermode = replica

[Producer.ALPIDE_plane_2]
serial      = DAQ-0009021F0E45320C
plane       = 2
triggermode = replica

[Producer.ALPIDE_plane_3]
serial      = DAQ-0009021F0E452A0B
plane       = 3
triggermode = replica
